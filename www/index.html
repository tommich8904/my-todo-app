<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>My To-Do</title>
<style>
  /* Layout: one narrow phone-first column; a top switch flips between Tasks and Training. */
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#76736c; --line:#e7e4de; --soft:#efede8;
    --accent:#1d1d1b;
    --personal:#0f8a7e; --personal-bg:#dff3f0;
    --hippo:#2a5bd7; --hippo-bg:#e3ebfc;
    --gold:#a87400; --gold-bg:#fbf0d3;
    --high:#c73a2e; --med:#d08a1a; --low:#a3a09a;
    --swim:#1b7fb5; --swim-bg:#e0f0f8;
    --bike:#b8690f; --bike-bg:#f8ecdb;
    --run:#cf4b35; --run-bg:#fbe5e0;
    --str:#6e5fae; --str-bg:#ece9f7;
    --ok:#1f8a4c; --ok-bg:#dff3e7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141413; --card:#1f1f1d; --ink:#f1efe9; --muted:#9b978e; --line:#2f2e2b; --soft:#292826;
      --accent:#f1efe9;
      --personal:#4cc9bb; --personal-bg:#17332f;
      --hippo:#7d9ff5; --hippo-bg:#1b2643;
      --gold:#e3b444; --gold-bg:#3a2f12;
      --high:#ef6b5e; --med:#e9a640; --low:#77746d;
      --swim:#5bb6e6; --swim-bg:#143041;
      --bike:#eaa04a; --bike-bg:#3a2a14;
      --run:#f17c66; --run-bg:#3d1f1a;
      --str:#a99bea; --str-bg:#2a2540;
      --ok:#5ccf8d; --ok-bg:#163223;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141413; --card:#1f1f1d; --ink:#f1efe9; --muted:#9b978e; --line:#2f2e2b; --soft:#292826;
    --accent:#f1efe9;
    --personal:#4cc9bb; --personal-bg:#17332f;
    --hippo:#7d9ff5; --hippo-bg:#1b2643;
    --gold:#e3b444; --gold-bg:#3a2f12;
    --high:#ef6b5e; --med:#e9a640; --low:#77746d;
    --swim:#5bb6e6; --swim-bg:#143041;
    --bike:#eaa04a; --bike-bg:#3a2a14;
    --run:#f17c66; --run-bg:#3d1f1a;
    --str:#a99bea; --str-bg:#2a2540;
    --ok:#5ccf8d; --ok-bg:#163223;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  body{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .wrap{max-width:560px;margin:0 auto;padding-block:16px 120px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
  h1{font-size:26px;margin:0;letter-spacing:-.02em}
  .date{color:var(--muted);font-size:14px}
  .views{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
  .views button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer}
  .views button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hippo);outline-offset:2px}

  /* ---- tasks (unchanged) ---- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tab .n{color:var(--muted);font-weight:500;margin-left:4px}
  .tab.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .tab.on .n{color:var(--bg);opacity:.7}
  .add{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
  .add input[type=text]{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;padding:6px 2px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;
    padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on.c-Personal{background:var(--personal-bg);color:var(--personal);border-color:transparent}
  .chip.on.c-Hippo{background:var(--hippo-bg);color:var(--hippo);border-color:transparent}
  .chip.on.c-Gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}
  .chip.on.p-High{color:var(--high);border-color:var(--high)}
  .chip.on.p-Medium{color:var(--med);border-color:var(--med)}
  .chip.on.p-Low{color:var(--ink);border-color:var(--muted)}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .due{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--muted);background:transparent;font-family:inherit}
  .addbtn{margin-left:auto;background:var(--accent);color:var(--bg);border:0;border-radius:999px;
    padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .addbtn:disabled{opacity:.35}
  .section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .section button{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:4px;font-family:inherit}
  ul{list-style:none;margin:0;padding:0}
  #list li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;margin-bottom:8px;position:relative}
  #list li.pri-High{box-shadow:inset 4px 0 0 var(--high)}
  #list li.pri-Medium{box-shadow:inset 4px 0 0 var(--med)}
  .check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;
    cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
  .check svg{width:14px;height:14px;opacity:0}
  li.done .check{background:var(--accent);border-color:var(--accent)}
  li.done .check svg{opacity:1;stroke:var(--bg)}
  .body{flex:1;min-width:0}
  .text{font-size:16px;word-wrap:break-word;cursor:text}
  li.done .text{text-decoration:line-through;color:var(--muted)}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px}
  .tag{border-radius:999px;padding:2px 8px;font-weight:600}
  .tag.c-Personal{background:var(--personal-bg);color:var(--personal)}
  .tag.c-Hippo{background:var(--hippo-bg);color:var(--hippo)}
  .tag.c-Gold{background:var(--gold-bg);color:var(--gold)}
  .tag.d{background:transparent;color:var(--muted);padding-left:0}
  .tag.d.late{color:var(--high)}
  .del{flex:none;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 4px;cursor:pointer;opacity:.6}
  .edit{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);color:var(--ink)}
  .empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:15px}
  .status{text-align:center;color:var(--muted);font-size:13px;margin:10px 0}
  .status.err{color:var(--high)}

  /* ---- training ---- */
  .num{font-variant-numeric:tabular-nums}
  .race{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
  .race-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .race-name{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .race-days{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .race-days small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
  .phase{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--ink);white-space:nowrap}
  .weekbar{display:grid;gap:6px}
  .weekbar-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .weekbar-head b{color:var(--ink)}
  .track{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;display:flex}
  .track span{height:100%}
  .sports{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sp{border-radius:12px;padding:8px 10px;display:grid;gap:2px;min-width:0}
  .sp .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .sp .v{font-size:15px;font-weight:700}
  .s-swim{background:var(--swim-bg);color:var(--swim)}
  .s-bike{background:var(--bike-bg);color:var(--bike)}
  .s-run{background:var(--run-bg);color:var(--run)}
  .s-strength{background:var(--str-bg);color:var(--str)}
  .s-other{background:var(--soft);color:var(--muted)}
  .sp .v{color:var(--ink)}

  .days{display:grid;gap:10px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .day.today{border-color:var(--ink)}
  .day-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 4px;gap:8px}
  .day-h .dn{font-weight:800;font-size:15px}
  .day-h .dd{color:var(--muted);font-size:13px}
  .day-h .badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--ink);border-radius:999px;padding:2px 8px}
  .sess{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-start}
  .day-h + .sess{border-top:0}
  .sess .check{width:24px;height:24px}
  .sess.done .check{background:var(--ok);border-color:var(--ok)}
  .sess.done .check svg{opacity:1;stroke:var(--card)}
  .ico{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
  .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sess-b{flex:1;min-width:0}
  .sess-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .sess-title{font-weight:650;font-size:15px}
  .sess.done .sess-title{color:var(--muted)}
  .dur{font-size:13px;color:var(--muted);white-space:nowrap}
  .sess-d{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
  .sess-d.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .fuel{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--gold);background:var(--gold-bg);border-radius:8px;padding:4px 8px;display:inline-block}
  .strava{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:4px 8px;display:inline-block}
  .rest{padding:8px 12px 12px;color:var(--muted);font-size:14px}
  .extra{padding:8px 12px 10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px}
  .chart-card svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filters .chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .wk{margin-bottom:12px}
  .wk-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:0 4px 6px}
  .acts{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .act{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
  .act:first-child{border-top:0}
  .act-b{flex:1;min-width:0}
  .act-n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-m{font-size:12.5px;color:var(--muted);margin-top:1px}
  .act-r{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
  .src{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .more{display:block;width:100%;margin-top:4px;background:none;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .logform{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;display:grid;gap:8px}
  .logform .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .logform label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
  .logform input,.logform select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
  .logform .acts-row{display:flex;gap:8px;justify-content:flex-end}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .note.err{color:var(--high)}
  .note button{flex:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

  /* ---- app shell additions (sign-in, safe areas) ---- */
  .wrap{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .hdr-right{display:flex;align-items:center;gap:8px}
  .linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
  .auth{margin-top:10vh}
  .auth h2{margin:0 0 4px;font-size:20px}
  .auth p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .auth input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--bg);color:var(--ink)}
  .auth .row{justify-content:space-between;margin-top:4px}
  .auth .addbtn{margin-left:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="pageTitle">To-Do</h1>
      <span class="date" id="today"></span>
    </div>
    <div class="hdr-right">
      <div class="views" role="tablist" id="views" hidden>
        <button id="vTasks" class="on" data-view="tasks" role="tab">Tasks</button>
        <button id="vTraining" data-view="training" role="tab">Training</button>
      </div>
      <button class="linkbtn" id="signOut" hidden>Sign out</button>
    </div>
  </header>

  <!-- ================= SIGN-IN ================= -->
  <form class="card auth" id="authView" hidden autocomplete="on">
    <h2 id="authTitle">Sign in</h2>
    <p>Use the same email and password on your phone and computer to keep them in sync.</p>
    <input type="email" id="email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password (6+ characters)" autocomplete="current-password" required minlength="6">
    <div class="row">
      <button type="button" class="linkbtn" id="authSwitch">New here? Create account</button>
      <button type="submit" class="addbtn" id="authBtn">Sign in</button>
    </div>
    <div class="row"><button type="button" class="linkbtn" id="forgot">Forgot password?</button></div>
    <div class="status" id="authStatus" hidden></div>
  </form>

  <div id="appView" hidden>
  <!-- ================= TASKS ================= -->
  <section id="tasksView">
    <div class="tabs" id="tabs"></div>
    <form class="add" id="addForm" autocomplete="off">
      <input type="text" id="newText" placeholder="Add a task…" maxlength="300">
      <div class="row" id="catRow"></div>
      <div class="row">
        <div id="priRow" style="display:flex;gap:6px"></div>
        <span class="sep"></span>
        <input type="date" class="due" id="newDue" aria-label="Due date">
        <button class="addbtn" id="addBtn" type="submit" disabled>Add</button>
      </div>
    </form>
    <div class="status" id="status">Loading…</div>
    <div id="list"></div>
  </section>

  <!-- ================= TRAINING ================= -->
  <section id="trainingView" hidden>
    <div id="raceCard"></div>
    <div class="section"><span>Next 7 days</span><span id="planSrc"></span></div>
    <div id="stravaNote"></div>
    <div class="days" id="days"></div>
    <div class="section"><span>Weekly volume · hours</span></div>
    <div class="chart-card" id="chart"></div>
    <div class="section"><span>Completed trainings</span><button id="logBtn">+ Log a session</button></div>
    <form class="logform" id="logForm" hidden autocomplete="off">
      <div class="grid">
        <label>Sport<select id="lSport">
          <option value="swim">Swim</option><option value="bike">Bike</option>
          <option value="run">Run</option><option value="strength">Strength</option><option value="other">Other</option>
        </select></label>
        <label>Date<input type="date" id="lDate"></label>
        <label>Duration (min)<input type="number" id="lMins" min="1" max="600" inputmode="numeric" placeholder="45"></label>
        <label>Distance (km)<input type="number" id="lKm" min="0" step="0.01" inputmode="decimal" placeholder="optional"></label>
      </div>
      <label>Session<input type="text" id="lName" maxlength="120" placeholder="e.g. Pool swim 1,500 m"></label>
      <label>Notes<input type="text" id="lNote" maxlength="200" placeholder="How it felt, what you ate…"></label>
      <div class="acts-row"><button type="button" class="ghost" id="lCancel">Cancel</button><button class="addbtn" id="lSave" type="submit">Save</button></div>
    </form>
    <div class="filters" id="filters"></div>
    <div id="history"></div>
  </section>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
